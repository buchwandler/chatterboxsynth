name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[cpu,dev]"
      - name: Verify SoXR runtime dependency
        run: |
          python - <<'PY'
          from importlib.metadata import version

          installed = version("soxr")
          print(f"soxr={installed}")
          if installed != "1.1.0":
              raise SystemExit(f"Expected soxr 1.1.0, got {installed}")
          PY
      - name: Download only the revision-pinned tokenizer fixtures
        run: |
          mkdir -p .ci-tokenizers
          curl --fail --location --silent --show-error \
            "https://huggingface.co/KitsuMate/chatterbox-nano-v2-onnx/resolve/851210533a5bcb4ad78e3ada6d527482dd1a31e7/tokenizer.json?download=true" \
            -o .ci-tokenizers/nano-v2.json
          curl --fail --location --silent --show-error \
            "https://huggingface.co/ResembleAI/chatterbox-turbo-ONNX/resolve/d21799bd0354adb85e348b8a0442a8405110a2cf/tokenizer.json?download=true" \
            -o .ci-tokenizers/turbo.json
          echo "f911e1a1742483aff9b11ce39fe2442dd71739121c2e3b78f245563e3db42882  .ci-tokenizers/nano-v2.json" | sha256sum --check
          echo "3f04e34bea22f9144d1a19151154095bc9ce0430bf421304f5797e716288a906  .ci-tokenizers/turbo.json" | sha256sum --check
      - name: Unit, audio, tokenizer, CLI, and cleanroom tests
        env:
          CHATTERBOX_NANO_TOKENIZER: .ci-tokenizers/nano-v2.json
          CHATTERBOX_TURBO_TOKENIZER: .ci-tokenizers/turbo.json
        run: python -m pytest -q
      - name: Ruff
        run: ruff check chatterboxsynth tests examples
      - name: Mypy
        run: mypy
      - name: Build source and wheel distributions
        run: python -m build
