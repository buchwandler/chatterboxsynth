name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu,dev]"
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import chatterboxsynth

          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag != chatterboxsynth.__version__:
              raise SystemExit(
                  f"Release tag {tag!r} does not match "
                  f"package version {chatterboxsynth.__version__!r}"
              )
          PY
      - name: Download pinned tokenizer fixtures
        run: |
          mkdir -p .ci-tokenizers
          curl --fail --location --silent --show-error \
            "https://huggingface.co/KitsuMate/chatterbox-nano-v2-onnx/resolve/851210533a5bcb4ad78e3ada6d527482dd1a31e7/tokenizer.json?download=true" \
            -o .ci-tokenizers/nano-v2.json
          curl --fail --location --silent --show-error \
            "https://huggingface.co/ResembleAI/chatterbox-turbo-ONNX/resolve/d21799bd0354adb85e348b8a0442a8405110a2cf/tokenizer.json?download=true" \
            -o .ci-tokenizers/turbo.json
          echo "f911e1a1742483aff9b11ce39fe2442dd71739121c2e3b78f245563e3db42882  .ci-tokenizers/nano-v2.json" | sha256sum --check
          echo "3f04e34bea22f9144d1a19151154095bc9ce0430bf421304f5797e716288a906  .ci-tokenizers/turbo.json" | sha256sum --check
      - name: Run unit tests
        env:
          CHATTERBOX_NANO_TOKENIZER: .ci-tokenizers/nano-v2.json
          CHATTERBOX_TURBO_TOKENIZER: .ci-tokenizers/turbo.json
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check chatterboxsynth tests examples
      - name: Run mypy
        run: python -m mypy
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Smoke test wheel in clean virtualenv
        run: |
          python -m venv /tmp/chatterboxsynth-release-venv
          /tmp/chatterboxsynth-release-venv/bin/python -m pip install --upgrade pip
          /tmp/chatterboxsynth-release-venv/bin/python -m pip install dist/*.whl
          /tmp/chatterboxsynth-release-venv/bin/python -c \
            "import chatterboxsynth; print(chatterboxsynth.__version__)"
          /tmp/chatterboxsynth-release-venv/bin/chatterboxsynth --help
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
