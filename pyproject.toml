[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterboxsynth"
dynamic = ["version"]
description = "Cleanroom Chatterbox synthesis engine for ONNX bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ChatterboxSynth contributors" }]
keywords = ["tts", "text-to-speech", "chatterbox", "onnx", "voice-cloning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy>=1.23",
  "tokenizers>=0.20,<1",
  "onnxvoice>=0.2.11,<0.3",
  "soundfile>=0.12,<1",
  "soxr>=0.5,<1",
]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu]>=0.2.11,<0.3"]
gpu = ["onnxvoice[gpu]>=0.2.11,<0.3"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "mypy>=1.11",
  "build>=1",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/buchwandler/chatterboxsynth"
Repository = "https://github.com/buchwandler/chatterboxsynth"
Issues = "https://github.com/buchwandler/chatterboxsynth/issues"

[project.scripts]
chatterboxsynth = "chatterboxsynth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chatterboxsynth*"]

[tool.setuptools.package-data]
chatterboxsynth = ["py.typed"]

[tool.setuptools_scm]
write_to = "chatterboxsynth/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "integration: tests requiring ONNX Runtime or installed bundle artifacts",
  "network: tests requiring external artifact downloads",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["chatterboxsynth"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
